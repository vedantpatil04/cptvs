<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>CPVTS</title>
    <style>
      :root {
        --bg: #f8f6f1;
        --fg: #26231f;
        --muted: #6f6a60;
        --brand: #0f8a5f;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #1c1a17;
          --fg: #f1eee8;
          --muted: #a8a298;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: var(--bg);
        color: var(--fg);
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      }
      main {
        width: 100%;
        max-width: 360px;
        text-align: center;
      }
      .mark {
        width: 56px;
        height: 56px;
        margin: 0 auto 20px;
        border-radius: 14px;
        background: var(--fg);
        color: var(--bg);
        display: grid;
        place-items: center;
        font-size: 28px;
        font-weight: 800;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 22px;
      }
      p {
        margin: 0 0 24px;
        color: var(--muted);
        line-height: 1.5;
      }
      button {
        width: 100%;
        min-height: 52px;
        border: 0;
        border-radius: 12px;
        background: var(--brand);
        color: #fff;
        font-size: 17px;
        font-weight: 600;
      }
      small {
        display: block;
        margin-top: 14px;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">P</div>
      <h1>Can't reach CPVTS</h1>
      <p>
        Check your internet connection. If the server was idle it can take up to a minute to wake
        up, so wait a moment and try again.
      </p>
      <button type="button" id="retry">Try again</button>
      <small id="status" role="status" aria-live="polite"></small>
    </main>
    <script>
      var target = '__CPVTS_WEB_URL__';
      var status = document.getElementById('status');
      var timer;
      function retry() {
        status.textContent = 'Connecting…';
        window.location.replace(target);
      }
      document.getElementById('retry').addEventListener('click', retry);
      // Keep trying quietly while this screen is visible.
      timer = window.setInterval(function () {
        if (document.visibilityState === 'visible' && navigator.onLine !== false) retry();
      }, 20000);
      window.addEventListener('online', retry);
    </script>
  </body>
</html>
