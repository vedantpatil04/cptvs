# Render Blueprint for the CPVTS API (https://render.com/docs/blueprint-spec).
# The web app is deployed separately (Vercel) and the database is Supabase.
services:
  - type: web
    name: cpvts-api
    runtime: node
    plan: free
    region: singapore
    # Repository root: npm workspaces need the root lockfile.
    buildCommand: npm ci --include=dev && npm run build:api
    # Applies pending migrations, then starts the server.
    startCommand: npm run db:migrate:deploy && npm run start:api
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: '22'
      - key: NODE_ENV
        value: production
      - key: APP_ENV
        value: production
      # Render terminates TLS in front of the service (one proxy hop).
      - key: TRUST_PROXY
        value: '1'
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
