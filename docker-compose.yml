# Local containers. Normal development uses the shared Supabase database (apps/api/.env).
#   docker compose up -d db          → local PostgreSQL for the automated tests
#                                      (create the test database once:
#                                       docker compose exec db createdb -U cpvts cpvts_test)
#   docker compose --profile app up --build
#                                    → self-contained stack: its own PostgreSQL + API + web
#
# Credentials below are for local, disposable use only.
name: cpvts

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cpvts
      POSTGRES_PASSWORD: cpvts
      POSTGRES_DB: cpvts
    ports:
      - '5432:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U cpvts -d cpvts']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    profiles: ['app']
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      APP_ENV: docker
      PORT: 4000
      DATABASE_URL: postgresql://cpvts:cpvts@db:5432/cpvts
      JWT_SECRET: ${JWT_SECRET:-local-docker-secret-change-me-0123456789abcdef}
      CORS_ORIGINS: http://localhost:8080
    ports:
      - '4000:4000'

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:4000
        VITE_API_URL: http://localhost:4000
    profiles: ['app']
    depends_on:
      - api
    ports:
      - '8080:80'

volumes:
  db-data:
